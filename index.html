<style>
/* Layout: one-column app, emerald title band, gold-ruled cards, fixed bottom tab bar on phones. */
@font-face { font-family: 'JN'; src: url('fonts/jameel-noori.woff2') format('woff2'); font-display: swap; }
:root {
  --bg: #F7F3E9; --paper: #FFFDF7; --ink: #1B2620; --muted: #5E6C63; --line: #E2D8BF;
  --em: #0F5132; --em2: #17704A; --emsoft: #E3EFE7; --gold: #B8892B; --goldsoft: #F6EBCB; --on-em: #FFF6DD;
  --warn: #9A4B12; --warnsoft: #FBE7D3;
  --urdu: 'JN', 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
  --arabic: 'Amiri', 'Traditional Arabic', serif;
  --shadow: 0 1px 2px rgba(15,81,50,.06), 0 8px 24px rgba(15,81,50,.08);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1612; --paper: #14211B; --ink: #EDE8DA; --muted: #A3B3A9; --line: #2A3B33;
  --em: #0C3A25; --em2: #1C7A50; --emsoft: #1A2E24; --gold: #D4AA4F; --goldsoft: #2E2814; --on-em: #FFF1CC;
  --warn: #F0A36A; --warnsoft: #3A2414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1612; --paper: #14211B; --ink: #EDE8DA; --muted: #A3B3A9; --line: #2A3B33;
  --em: #0C3A25; --em2: #1C7A50; --emsoft: #1A2E24; --gold: #D4AA4F; --goldsoft: #2E2814; --on-em: #FFF1CC;
  --warn: #F0A36A; --warnsoft: #3A2414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--urdu); direction: rtl; line-height: 2.1; font-size: 17px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--em); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--em2); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--em);
  background-image: radial-gradient(circle at 12px 12px, rgba(212,170,79,.18) 2px, transparent 2.5px); background-size: 24px 24px;
  border-bottom: 3px solid var(--gold); color: var(--on-em); }
.top .in { max-width: 980px; margin: 0 auto; padding-block: 8px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; }
.brand { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.brand h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.9; text-wrap: balance; }
.brand small { display: block; font-size: 14px; opacity: .85; line-height: 1.6; }
.star { width: 38px; height: 38px; flex: none; }
.tabs { display: flex; gap: 4px; }
.tabs a { text-decoration: none; color: var(--on-em); padding: 2px 14px; border-radius: 999px; font-size: 16px; line-height: 2; opacity: .85; }
.tabs a[aria-current="page"] { background: var(--gold); color: #1B1405; opacity: 1; }
.themebtn { background: transparent; border: 1px solid rgba(255,246,221,.4); color: var(--on-em); border-radius: 999px; width: 38px; height: 38px; cursor: pointer; flex: none; line-height: 1; font-family: system-ui; }

main { max-width: 980px; margin: 0 auto; padding-block: 18px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }

/* ---------- search ---------- */
.searchbox { position: relative; }
.searchbox input { width: 100%; border: 2px solid var(--line); background: var(--paper); border-radius: 16px; padding: 6px 52px 6px 16px; font-size: 20px; line-height: 2.2; box-shadow: var(--shadow); }
.searchbox input:focus { border-color: var(--gold); outline: none; }
.searchbox svg { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; margin: 4px 4px 0; line-height: 1.9; }
.results { display: grid; gap: 8px; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: right; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; cursor: pointer; width: 100%; }
.res:hover { border-color: var(--gold); }
.res .nm { font-size: 19px; font-weight: 600; min-width: 0; }
.res .chain { grid-column: 1 / -1; color: var(--muted); font-size: 14px; line-height: 1.9; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 0 10px; font-size: 13px; line-height: 1.9; white-space: nowrap; background: var(--emsoft); color: var(--em2); }
.chip.gold { background: var(--goldsoft); color: var(--gold); }
.chip.warn { background: var(--warnsoft); color: var(--warn); }

/* ---------- cards ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 6px; font-size: 21px; color: var(--em2); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2::before { content: ""; width: 10px; height: 10px; background: var(--gold); transform: rotate(45deg); flex: none; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.stat b { font-size: 28px; color: var(--em2); font-variant-numeric: tabular-nums; display: block; line-height: 1.6; }
.stat span { color: var(--muted); font-size: 14px; }
.branches { display: grid; gap: 8px; }
.branch { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: right; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 4px 12px; cursor: pointer; }
.branch:hover { border-color: var(--gold); }
.verse { font-family: var(--arabic); font-size: 22px; line-height: 2; text-align: center; color: var(--em2); margin: 0; }
.verse + p { text-align: center; color: var(--muted); font-size: 15px; margin: 0; }

/* ---------- person ---------- */
.hero { background: var(--em); color: var(--on-em); border-radius: 20px; padding: 16px 20px; display: grid; gap: 4px; border: 2px solid var(--gold); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto -40px -60px auto; width: 180px; height: 180px; border: 2px solid rgba(212,170,79,.35); transform: rotate(45deg); }
.hero .nm { font-size: 32px; font-weight: 700; line-height: 2; text-wrap: balance; position: relative; z-index: 1; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 6px; position: relative; z-index: 1; }
.hero .chip { background: rgba(255,246,221,.14); color: var(--on-em); }
.hero .chip.gold { background: var(--gold); color: #1B1405; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 0 16px; line-height: 2.3; cursor: pointer; font-size: 15px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--em2); color: #fff; border-color: var(--em2); }
.btn[disabled] { opacity: .6; cursor: wait; }
.btn.gold { background: var(--gold); color: #1B1405; border-color: var(--gold); }

.hero .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 14px; line-height: 1.9; position: relative; z-index: 1; opacity: .9; }
.hero .crumb button { background: none; border: 0; color: var(--on-em); padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(212,170,79,.6); text-underline-offset: 6px; }
.hero .crumb span { opacity: .6; }
.hero .bin { font-size: 17px; opacity: .9; position: relative; z-index: 1; margin-top: -6px; }
.sons { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.scard { display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: right; gap: 0 10px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 14px; cursor: pointer; width: 100%; }
.scard:hover, .scard:focus-visible { border-color: var(--gold); background: var(--goldsoft); }
.scard .sn { font-size: 19px; font-weight: 600; line-height: 2; min-width: 0; }
.scard .sm { grid-column: 1; color: var(--muted); font-size: 13px; line-height: 1.7; }
.scard .chev { grid-row: 1 / span 2; grid-column: 2; color: var(--gold); font-size: 26px; font-family: system-ui; line-height: 1; }
.ladder { display: grid; justify-items: center; gap: 0; }
.rung { display: grid; justify-items: center; gap: 0; min-width: 62%; max-width: 100%; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 2px 16px 6px; cursor: pointer; text-align: center; }
.rung:hover { border-color: var(--gold); }
.rung .rl { font-size: 12px; color: var(--muted); line-height: 1.8; }
.rung .rn { font-size: 18px; line-height: 1.9; }
.rung.me { border: 2.5px solid var(--gold); background: var(--goldsoft); cursor: default; }
.rung.me .rn { font-size: 21px; font-weight: 700; }
.ladder .conn { height: 14px; }
.sibs { margin-top: 12px; display: grid; justify-items: center; gap: 4px; }
.fam-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pbox { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 0 14px; cursor: pointer; line-height: 2.2; font-size: 17px; text-align: center; }
.pbox:hover { border-color: var(--gold); }
.pbox.sib { color: var(--ink); font-size: 16px; }
.conn { width: 2px; height: 16px; background: var(--muted); opacity: .5; }
.lbl { color: var(--muted); font-size: 13px; line-height: 1.6; }

.lineage { list-style: none; margin: 4px 0 0; padding: 0; display: grid; }
.lineage li { display: grid; grid-template-columns: 50px 1fr; align-items: center; gap: 8px; position: relative; min-height: 52px; }
.lineage li::before { content: ""; position: absolute; right: 24px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.lineage li:first-child::before { top: 50%; } .lineage li:last-child::before { bottom: 50%; }
.lineage .g { position: relative; z-index: 1; justify-self: center; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--gold); color: var(--em2); font-size: 15px; line-height: 1; font-variant-numeric: tabular-nums; }
.lrow { display: grid; text-align: right; background: none; border: 0; border-radius: 10px; padding: 0 8px; cursor: pointer; width: 100%; }
.lrow:hover { background: var(--emsoft); }
.lrow .ln { font-size: 18px; line-height: 1.9; }
.lrow .lm { display: flex; gap: 8px; color: var(--muted); font-size: 13px; line-height: 1.5; padding-bottom: 4px; }
.lrow .lm b { color: var(--gold); font-weight: 600; }
.lineage li.cur .g { background: var(--gold); color: #1B1405; }
.lineage li.cur .ln { font-weight: 700; }
.lineage li.cur .lrow { background: var(--goldsoft); }
.lrow.more { color: var(--em2); font-size: 15px; line-height: 2.4; }
.rel { color: var(--muted); font-size: 13px; margin-inline-start: 8px; }

.note { background: var(--goldsoft); border-radius: 12px; padding: 6px 14px; font-size: 15px; line-height: 2; }
.note.warn { background: var(--warnsoft); color: var(--warn); }

/* ---------- tree explorer ---------- */
.treebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tree { list-style: none; margin: 0; padding: 0; overflow-x: auto; }
.tree ul { list-style: none; margin: 0; padding: 0 22px 0 0; border-right: 2px solid var(--line); margin-right: 13px; }
.tree li { position: relative; }
.tree ul > li::before { content: ""; position: absolute; right: -22px; top: 1.15em; width: 18px; border-top: 2px solid var(--line); }
.node { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tg { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; display: grid; place-items: center; font-family: system-ui; font-size: 14px; line-height: 1; padding: 0; flex: none; }
.tg[disabled] { visibility: hidden; }
.tn { background: none; border: 0; padding: 0 6px; cursor: pointer; font-size: 17px; line-height: 2.2; border-radius: 8px; }
.tn:hover { background: var(--emsoft); }
.tn.hl { background: var(--goldsoft); }
.tn.mark { outline: 2px solid var(--gold); }
.cnt { color: var(--muted); font-size: 12px; font-family: system-ui; font-variant-numeric: tabular-nums; }

/* ---------- visual tree ---------- */
.seg.mode { display: inline-flex; gap: 0; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg.mode button { border: 0; background: var(--paper); padding: 0 16px; line-height: 2.2; cursor: pointer; font-size: 15px; }
.seg.mode button[aria-selected="true"] { background: var(--em2); color: #fff; }
.map { position: relative; height: min(72vh, 640px); margin-top: 8px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: var(--bg); background-image: radial-gradient(circle at 10px 10px, var(--line) 1.2px, transparent 1.6px); background-size: 20px 20px; }
.map svg { width: 100%; height: 100%; display: block; cursor: grab; }
.map svg:active { cursor: grabbing; }
.map .ml { fill: none; stroke: var(--muted); stroke-opacity: .55; stroke-width: 2; }
.map .mn { cursor: pointer; }
.map .mn > rect { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
.map .mn > text { font-family: var(--urdu); font-size: 17px; fill: var(--ink); text-anchor: middle; direction: rtl; }
.map .mn.hl > rect { fill: var(--goldsoft); stroke: var(--gold); }
.map .mn.focus > rect { stroke: var(--gold); stroke-width: 4; }
.map .mn.sel > rect { stroke: var(--em2); stroke-width: 4; }
.map .more { fill: var(--em2); }
.map .mt { font-family: system-ui; font-size: 12px; fill: #fff; text-anchor: middle; direction: ltr; unicode-bidi: plaintext; }
.mapctl { position: absolute; top: 10px; left: 10px; display: grid; gap: 6px; }
.mapctl button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow); font-size: 20px; line-height: 1; cursor: pointer; font-family: system-ui; color: var(--ink); }
.mapinfo { position: absolute; inset: auto 10px 10px 10px; background: var(--paper); border: 1.5px solid var(--gold); border-radius: 14px; padding: 6px 12px 10px; box-shadow: var(--shadow); display: grid; gap: 4px; }
.mapinfo b { font-size: 19px; } .mapinfo small { color: var(--muted); font-size: 13px; margin-inline-start: 10px; }
.mapinfo .btn { line-height: 2.1; }

.sub { border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; margin-top: 10px; display: grid; gap: 6px; background: var(--bg); }
.subh { display: flex; justify-content: space-between; align-items: center; } .subh small { color: var(--muted); font-size: 12px; font-family: system-ui; }
.subt { font-size: 16px; } .subt small { color: var(--muted); font-size: 13px; }
.subr { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.subn { flex: 1 1 140px; min-width: 0; border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 0 10px; line-height: 2.1; font-size: 17px; }
.subf { font-size: 14px; color: var(--muted); }

/* ---------- forms ---------- */
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 2px; }
.field label { font-size: 15px; color: var(--muted); }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 4px 12px; line-height: 2; font-size: 17px; width: 100%; }
.field textarea { min-height: 110px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); outline: none; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { border: 1.5px solid var(--line); border-radius: 999px; padding: 0 14px; line-height: 2.2; cursor: pointer; font-size: 15px; }
.seg label { position: relative; } .seg input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; pointer-events: none; }
.seg input:checked + span { color: var(--em2); font-weight: 700; }
.seg label:has(input:checked) { border-color: var(--em2); background: var(--emsoft); }
.out { white-space: pre-wrap; background: var(--bg); border: 1px dashed var(--gold); border-radius: 12px; padding: 10px 14px; font-size: 15px; line-height: 2; user-select: all; }
.picker { position: relative; }
.picker .drop { position: absolute; inset: 100% 0 auto 0; z-index: 5; background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; max-height: 280px; overflow: auto; box-shadow: var(--shadow); }
.picker .drop button { display: block; width: 100%; text-align: right; border: 0; background: none; padding: 2px 12px; cursor: pointer; line-height: 2; font-size: 16px; }
.picker .drop button:hover, .picker .drop button:focus { background: var(--emsoft); }
.picker .drop small { color: var(--muted); font-size: 13px; }
.chosen { font-size: 15px; color: var(--em2); }
.sonrow { display: grid; grid-template-columns: 2em 1fr 7.5em; gap: 8px; align-items: center; margin-bottom: 6px; }
.sonrow .sn { color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.sonrow input { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 4px 12px; line-height: 2; font-size: 17px; width: 100%; min-width: 0; }
.sonrow input:focus { border-color: var(--gold); outline: none; }

.result-rel { text-align: center; display: grid; gap: 4px; }
.result-rel .big { font-size: 26px; font-weight: 700; color: var(--em2); line-height: 2; }
.pt { width: 100%; border-collapse: collapse; font-size: 16px; }
.pt th { text-align: right; color: var(--muted); font-weight: 400; font-size: 14px; border-bottom: 2px solid var(--gold); padding: 0 8px; }
.pt td { border-bottom: 1px solid var(--line); padding: 0 8px; line-height: 2.2; }
.pt td.gn { color: var(--em2); font-weight: 700; width: 3.5em; text-align: center; font-variant-numeric: tabular-nums; }
.pt td.gy { white-space: nowrap; font-variant-numeric: tabular-nums; }
.pt tr:nth-child(even) td { background: var(--emsoft); }
.newchip { background: var(--goldsoft); color: var(--gold); }
.paths { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.paths ol { margin: 0; padding: 0 18px 0 0; font-size: 15px; }

  .replace(/[()\[\]،۔.,\-ـ]/g, ' ').replace(/\s+/g, ' ').trim();
const UR2LAT = {'ب':'b','پ':'p','ت':'t','ٹ':'t','ط':'t','ث':'s','س':'s','ص':'s','ج':'j','چ':'c','ح':'h','ہ':'h','ھ':'h','خ':'x','د':'d','ڈ':'d','ذ':'z','ز':'z','ض':'z','ظ':'z','ژ':'z','ر':'r','ڑ':'r','ش':'S','غ':'g','گ':'g','ف':'f','ق':'k','ک':'k','ل':'l','م':'m','ن':'n'};
const skelUr = s => [...norm(s)].map(c => c === ' ' ? ' ' : (UR2LAT[c] || '')).join('').replace(/ +/g, ' ').trim();
const skelLat = s => s.toLowerCase().replace(/sh/g,'S').replace(/ch/g,'c').replace(/kh/g,'x').replace(/gh/g,'g').replace(/th/g,'t').replace(/ph/g,'f')
  .replace(/q/g,'k').replace(/c(?!$)/g, m => m).replace(/[aeiouyw'v]/g,'').replace(/[^a-zS ]/g,'').replace(/(.)\1+/g,'$1').replace(/ +/g,' ').trim();
const dedupe = s => s.replace(/(.)\1+/g, '$1');

function search(q) {
  q = q.trim(); if (!q) return [];
  const latin = /[a-z]/i.test(q);
  const toks = latin ? skelLat(q).split(' ').filter(Boolean) : norm(q).split(' ').filter(Boolean);
  const out = [];
  for (const p of Object.values(P)) {
    if (p.id === 'R') continue;
    const hay = latin ? p._sk : p._n;
    if (!toks.every(t => hay.includes(t))) continue;
    let sc = 0;
    const full = latin ? toks.join(' ') : norm(q);
    if (hay === full) sc += 100; else if (hay.startsWith(full)) sc += 50; else if (hay.includes(full)) sc += 25;
    sc -= Math.abs(hay.length - full.length) * .2;
    if (latin) { const raw = q.toLowerCase().replace(/sh/g,'S').replace(/ch/g,'c').replace(/kh/g,'x').replace(/gh/g,'g').replace(/th/g,'t').replace(/ph/g,'f').replace(/q/g,'k').replace(/[aeiouyw'v]/g,'').replace(/[^a-zS ]/g,'').replace(/ +/g,' ').trim(); if (p._sk2.includes(raw)) sc += 40; if (p._sk2 === raw) sc += 40; }
    sc += p.g / 100;
    out.push([sc, p]);
  }
  return out.sort((a, b) => b[0] - a[0]).slice(0, 60).map(x => x[1]);
}

/* ---------- tree helpers ---------- */
function ancestors(id) { const a = []; let p = P[id]; while (p) { a.push(p.id); p = P[p.f]; } return a; }
function chainText(p, n = 3) { const a = []; let f = P[p.f]; while (f && a.length < n) { a.push(f.id === 'R' ? 'حضور ﷺ' : f.n); f = P[f.f]; } return a.length ? 'بن ' + a.join(' ← ') : ''; }
function descCount(id) { let c = 0, st = [...P[id].c]; while (st.length) { const x = st.pop(); c++; st.push(...P[x].c); } return c; }
const label = p => p.id === 'R' ? 'حضرت محمد مصطفےٰ ﷺ' : p.n;
const rng = (a, b) => `\u2066${U(a)}–${U(b)}\u2069ء`;   // keep "1970–1990" left-to-right inside Urdu text
function yrs(g) { const r = DATA.meta.genYears && DATA.meta.genYears[g]; if (!r) return ''; return r[0] === r[1] ? `${U(r[0])}ء` : rng(r[0], r[1]); }
function yrMid(g) { const r = DATA.meta.genYears && DATA.meta.genYears[g]; if (!r) return ''; if (r[0] === r[1]) return `${U(r[0])}ء`;
  const m = Math.round((r[0] + r[1]) / 20) * 10; return rng(m - 10, Math.min(m + 10, 2025)); }
function bornTxt(p) { if (p.d) return `پیدائش ${U(p.d)} کی دہائی`; const r = DATA.meta.genYears && DATA.meta.genYears[p.g]; if (!r) return ''; return r[0] === r[1] ? `پیدائش ${U(r[0])}ء` : `پیدائش تقریباً ${yrs(p.g)}`; }

/* ---------- relationship ---------- */
function upWord(n) { return ['', 'والد', 'دادا', 'پردادا', 'سکڑدادا', 'نکڑدادا'][n] || `${U(n)} پشت اوپر جدِ امجد`; }
function downWord(n) { return ['', 'بیٹا', 'پوتا', 'پڑپوتا', 'سکڑپوتا', 'نکڑپوتا'][n] || `${U(n)} پشت نیچے اولاد`; }
function relation(aId, bId) {
  if (aId === bId) return { big: 'ایک ہی شخص', a: 0, b: 0, lca: aId };
  const A = ancestors(aId), B = ancestors(bId), setA = new Map(A.map((x, i) => [x, i]));
  let j = 0; while (j < B.length && !setA.has(B[j])) j++;
  const lca = B[j], a = setA.get(lca), b = j;
  let big;
  if (a === 0) big = `${label(P[bId])}، ${label(P[aId])} کے ${downWord(b)} ہیں`;
  else if (b === 0) big = `${label(P[bId])}، ${label(P[aId])} کے ${upWord(a)} ہیں`;
  else if (a === 1 && b === 1) big = 'سگے بھائی';
  else if (a === 2 && b === 1) big = `${label(P[bId])}، ${label(P[aId])} کے چچا / تایا ہیں`;
  else if (a === 1 && b === 2) big = `${label(P[bId])}، ${label(P[aId])} کے بھتیجے ہیں`;
  else if (a === 2 && b === 2) big = 'چچا زاد بھائی (فرسٹ کزن)';
  else if (a === 3 && b === 3) big = 'دوسرے درجے کے چچا زاد (سیکنڈ کزن)';
  else if (a === b) big = `${U(a - 1)}ویں درجے کے چچا زاد`;
  else if (a > b) big = `${label(P[bId])}، ${label(P[aId])} سے ${U(a - b)} پشت اوپر کی نسل میں ہیں`;
  else big = `${label(P[bId])}، ${label(P[aId])} سے ${U(b - a)} پشت نیچے کی نسل میں ہیں`;
  return { big, a, b, lca, A: A.slice(0, a + 1), B: B.slice(0, b + 1) };
}

  document.querySelectorAll('.tabs a, .bottombar a').forEach(a => { if (a.getAttribute('href') === '#' + view) a.setAttribute('aria-current', 'page'); });
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2200); }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); toast('کاپی ہو گیا'); }
  catch (e) { const r = document.createRange(); const el = btn?.closest('.card')?.querySelector('.out'); if (el) { r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('متن منتخب ہے، کاپی کر لیں'); }
}

/* ---------- visual tree (pan / pinch-zoom SVG) ---------- */
function treeMap(box, focus) {
  const svg = box.querySelector('svg'), vp = svg.querySelector('#vp'), info = box.querySelector('#mapInfo');
  let DEPTH = 4; const BH = 46, VG = 96, HG = 14;
  const cv = document.createElement('canvas').getContext('2d');
  const tw = (t, sz) => { cv.font = `${sz}px JN, "Noto Nastaliq Urdu", serif`; return cv.measureText(t).width; };
  let T = { x: 0, y: 0, k: 1 }, root = null, nodes = {}, sel = null, api = { onRoot: null };
  const apply = () => vp.setAttribute('transform', `translate(${T.x},${T.y}) scale(${T.k})`);
  function layout(r) {
    nodes = {};
    const SG = 28;   // vertical gap between stacked sons
    const mk = (id, d) => { const p = P[id], w = Math.max(70, tw(label(p), 17) + 30);
      const kids = d < DEPTH ? p.c.map(c => mk(c, d + 1)) : [];
      const stack = kids.length > 1 && kids.every(k => !k.kids.length);   // sons with nothing shown below: stack in a column
      const cw = stack ? Math.max(...kids.map(k => k.w)) + 22 : kids.reduce((a, k) => a + k.span, 0) + HG * Math.max(0, kids.length - 1);
      const n = { id, w, d, kids, stack, span: Math.max(w, cw), cw, more: d >= DEPTH ? descCount(id) : 0 }; nodes[id] = n; return n; };
    const place = (n, left, y) => { n.y = y;
      if (n.stack) { n.cx = left + n.span / 2; n.spine = n.cx + n.cw / 2 - 4;
        n.kids.forEach((k, j) => { k.y = y + VG + j * (BH + SG); k.cx = n.spine - 18 - k.w / 2; }); }
      else if (n.kids.length) { let x = left + n.span - (n.span - n.cw) / 2;   // eldest on the right
        n.kids.forEach(k => { place(k, x - k.span, y + VG); x -= k.span + HG; });
        n.cx = (n.kids[0].cx + n.kids[n.kids.length - 1].cx) / 2; }
      else n.cx = left + n.span / 2; };
    let top;
    for (DEPTH = 4; DEPTH >= 1; DEPTH--) { nodes = {}; top = mk(r, 0); if (top.span * 0.5 <= Math.max(box.clientWidth, 320) * 3) break; }
    if (DEPTH < 1) { DEPTH = 1; nodes = {}; top = mk(r, 0); }
    place(top, 0, 0); return top;
  }
  function draw(top) {
    const e = [], b = [];
    Object.values(nodes).forEach(n => {
      const p = P[n.id];
      if (n.stack) { const my = n.y + BH + (VG - BH) / 2, last = n.kids[n.kids.length - 1];
        e.push(`M${n.cx},${n.y + BH}V${my}H${n.spine}V${last.y + BH / 2}`);
        n.kids.forEach(k => e.push(`M${n.spine},${k.y + BH / 2}H${k.cx + k.w / 2}`)); }
      else if (n.kids.length) { const my = n.y + BH + (VG - BH) / 2;
        e.push(`M${n.cx},${n.y + BH}V${my}`);
        const xs = n.kids.map(k => k.cx); e.push(`M${Math.min(...xs)},${my}H${Math.max(...xs)}`);
        n.kids.forEach(k => e.push(`M${k.cx},${my}V${k.y}`)); }
      const cls = ['mn', p.hl ? 'hl' : '', n.id === focus ? 'focus' : '', n.id === sel ? 'sel' : ''].join(' ');
      b.push(`<g class="${cls}" data-id="${n.id}" transform="translate(${n.cx - n.w / 2},${n.y})"><rect width="${n.w}" height="${BH}" rx="12"/><text x="${n.w / 2}" y="${BH / 2 + 7}">${esc(label(p))}</text>${n.more ? `<g class="mb" transform="translate(${n.w / 2 - 22},${BH - 4})"><rect class="more" width="44" height="22" rx="11"/><text class="mt" x="22" y="16">+${n.more}</text></g>` : ''}</g>`);
    });
    vp.innerHTML = `<path class="ml" d="${e.join('')}"/>${b.join('')}`;
  }
  function fit(centerId) {
    const W = box.clientWidth, H = box.clientHeight, top = nodes[root];
    const totalH = Math.max(...Object.values(nodes).map(n => n.y)) + BH + 34;
    T.k = Math.max(0.5, Math.min(1, (W - 24) / top.span));
    box.style.height = Math.round(Math.max(300, Math.min(innerHeight * 0.72, totalH * T.k + 70))) + 'px';
    const c = nodes[centerId && nodes[centerId] ? centerId : root];
    if (c && top.span * T.k > W) { T.x = W / 2 - c.cx * T.k; T.y = Math.min(16, H / 2 - c.y * T.k); }
    else { T.x = (W - top.span * T.k) / 2; T.y = 16; }
    apply();
  }
  function select(id) {
    sel = id; vp.querySelectorAll('.mn.sel').forEach(g => g.classList.remove('sel'));
    vp.querySelector(`.mn[data-id="${id}"]`)?.classList.add('sel');
    const p = P[id], n = p.c.length;
    info.hidden = false;
    info.innerHTML = `<div><b>${esc(label(p))}</b><small>پشت ${U(p.g)}${n ? ` · ${U(n)} بیٹے` : ''}</small></div>
      <div class="actions">${id !== root && n ? `<button class="btn primary" type="button" id="mHere">یہاں سے دیکھیں</button>` : ''}<button class="btn" type="button" data-go="${id}">تفصیل</button><button class="btn" type="button" id="mClose" aria-label="بند کریں">✕</button></div>`;
    document.getElementById('mHere')?.addEventListener('click', () => render(id, id));
    document.getElementById('mClose').onclick = () => { info.hidden = true; sel = null; vp.querySelectorAll('.mn.sel').forEach(g => g.classList.remove('sel')); };
  }
  function render(r, centerId) {
    root = r; if (api.onRoot) api.onRoot(r); info.hidden = true; sel = null;
    const go_ = () => { draw(layout(r)); fit(centerId || focus || r); };
    document.fonts && document.fonts.status !== 'loaded' ? document.fonts.ready.then(go_) : go_();
  }
  // gestures
  const pts = new Map(); let start = null, moved = false;
  const zoomAt = (k, cx, cy) => { k = Math.max(0.2, Math.min(2.5, k)); T.x = cx - (cx - T.x) * (k / T.k); T.y = cy - (cy - T.y) * (k / T.k); T.k = k; apply(); };
  const rel = e => { const r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, rel(e)); moved = false;
    start = { T: { ...T }, pts: new Map([...pts].map(([k, v]) => [k, [...v]])) }; });
  svg.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, rel(e));
    const a = [...pts.values()], s0 = [...start.pts.values()];
    if (a.length === 1 && s0.length === 1) { const dx = a[0][0] - s0[0][0], dy = a[0][1] - s0[0][1];
      if (Math.abs(dx) + Math.abs(dy) > 6) moved = true; T.x = start.T.x + dx; T.y = start.T.y + dy; apply(); }
    else if (a.length === 2 && s0.length === 2) { moved = true;
      const d = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]); const m = [(a[0][0] + a[1][0]) / 2, (a[0][1] + a[1][1]) / 2];
      const m0 = [(s0[0][0] + s0[1][0]) / 2, (s0[0][1] + s0[1][1]) / 2];
      const k = Math.max(0.2, Math.min(2.5, start.T.k * d(a[0], a[1]) / d(s0[0], s0[1])));
      T.k = k; T.x = m[0] - (m0[0] - start.T.x) * (k / start.T.k); T.y = m[1] - (m0[1] - start.T.y) * (k / start.T.k); apply(); } });
  const end = e => { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (!moved && pts.size === 0) { const el = document.elementFromPoint(e.clientX, e.clientY), g = el?.closest('.mn'); if (g) { if (el.closest('.mb')) render(g.dataset.id, g.dataset.id); else select(g.dataset.id); } }
    start = { T: { ...T }, pts: new Map([...pts].map(([k, v]) => [k, [...v]])) }; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = rel(e); zoomAt(T.k * (e.deltaY < 0 ? 1.15 : 1 / 1.15), x, y); }, { passive: false });
  box.querySelector('#zIn').onclick = () => zoomAt(T.k * 1.3, box.clientWidth / 2, box.clientHeight / 2);
  box.querySelector('#zOut').onclick = () => zoomAt(T.k / 1.3, box.clientWidth / 2, box.clientHeight / 2);
  box.querySelector('#zFit').onclick = () => { const W = box.clientWidth, H = box.clientHeight, top = nodes[root];
    const totalH = Math.max(...Object.values(nodes).map(n => n.y)) + BH + 34;
    T.k = Math.max(0.15, Math.min(1, (W - 24) / top.span, (H - 24) / totalH)); T.x = (W - top.span * T.k) / 2; T.y = 16; apply(); };
  box.querySelector('#zUp').onclick = () => { const f = P[root] && P[root].f; if (f && P[f]) render(f, root); else toast('یہ سب سے اوپر ہے'); };
  api.render = render; return api;
}

function picker(id, initial, lab) {
  return `<div class="field picker" id="${id}"><label for="${id}-i">${lab}</label><input id="${id}-i" type="search" placeholder="نام لکھیں…" autocomplete="off" value="${initial ? esc(P[initial].n) : ''}"><div class="drop" hidden></div><div class="chosen">${initial ? esc(chainText(P[initial], 2)) : ''}</div></div>`;
}
function bindPicker(id, onPick, initial) {
  const box = document.getElementById(id), inp = box.querySelector('input'), drop = box.querySelector('.drop'), ch = box.querySelector('.chosen');
  let val = initial || null;
  inp.addEventListener('input', () => {
    const r = search(inp.value).slice(0, 12); drop.hidden = !r.length;
    drop.innerHTML = r.map(p => `<button type="button" data-v="${p.id}">${esc(p.n)} <small>${esc(chainText(p, 2))}</small></button>`).join('');
  });
  drop.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; val = b.dataset.v; inp.value = P[val].n; ch.textContent = chainText(P[val], 2); drop.hidden = true; onPick(val); });
  inp.addEventListener('blur', () => setTimeout(() => drop.hidden = true, 200));
  return () => val;
}

    const t = T ? P[T] : null;
    const payload = { type: k, target: t ? t.id : '', targetName: t ? `${t.n} (${chainText(t, 2)})` : '', names, years, details: details.value.trim(), from: who.value.trim(), contact: contact.value.trim(), website: document.getElementById('website').value };
    const kindTxt = { add: 'بیٹوں کا اضافہ', fix: 'اصلاح', other: 'دیگر' }[k];
    const lines = [`نوعیت: ${kindTxt}`];
    if (t) lines.push(`فرد: ${t.n} (${t.id}) — ${chainText(t, 3)}`);
    if (k === 'add') lines.push('بیٹے:', ...rows.map(r => `- ${r.n}${r.y ? ' (' + r.y + ')' : ''}`));
    if (k === 'fix') lines.push('درست نام: ' + names[0]);
    if (payload.details) lines.push('تفصیل: ' + payload.details);
    lines.push(`بھیجنے والے: ${payload.from} | ${payload.contact}`);
    {
      const btn = document.getElementById('sendBtn'); btn.disabled = true; btn.textContent = 'جمع ہو رہا ہے…';
      try {
        const r = await fetch(CONFIG.backend, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || 'failed');
        out.innerHTML = `<p class="note">شکریہ! آپ کی تجویز منتظمین کو پہنچ گئی ہے (${U(j.count)} اندراج)۔ تصدیق کے بعد یہ شجرہ میں نظر آئے گی۔</p>`;
        store('shajra.draft', JSON.stringify({ who: payload.from, contact: payload.contact })); sf.reset(); sons.innerHTML = sonRow(0) + sonRow(1);
      } catch (err) {
        out.innerHTML = `<p class="note warn">ابھی جمع نہیں ہو سکا۔ انٹرنیٹ چیک کر کے دوبارہ «جمع کریں» دبائیں۔</p>`;
      } finally { btn.disabled = false; btn.textContent = 'جمع کریں'; }
      return;
    }
  });
}

function viewPusht() {
  setNav('');
  const gy = DATA.meta.genYears || {};
  const rows = Object.keys(gy).map(Number).sort((a, b) => a - b).map(g => {
    const who = Object.values(P).filter(p => p.g === g && p.id !== 'R');
    const ex = g === 0 ? 'حضور اکرم ﷺ' : (who.find(p => p.hl) || who[0] || {}).n || '';
    return `<tr><td class="gn">${U(g)}</td><td class="gy">${yrs(g)}</td><td class="ge">${esc(ex)}${who.length > 1 ? ` <span class="cnt">+${U(who.length - 1)}</span>` : ''}</td></tr>`;
  }).join('');
  app.innerHTML = `<section class="card"><h2>ہر پشت کا زمانہ</h2>
    <p class="hint">شجرہ میں تاریخیں درج نہیں، اس لیے ہر پشت کا زمانۂ پیدائش اندازاً نکالا گیا ہے۔ یہ اندازہ ان بزرگوں کی معروف تاریخِ پیدائش پر قائم ہے:
    حضور اکرم ﷺ (570ء)، امام حسنؓ (625ء)، عبداللہ المحض (690ء)، غوث اعظمؒ (1078ء)، سید عبدالرزاقؒ (1134ء)، اور داتا کی حالیہ نسلوں کی معلوم تاریخیں۔ درمیان کی پشتوں کا زمانہ ان کے بیچ برابر بانٹا گیا ہے۔</p>
    <p class="note">اوسطاً ایک پشت ≈ <b>34 سال</b> (غوث اعظمؒ کے صاحبزادے سے آج تک کا اوسط)۔ داتا کے خاندانوں میں حالیہ پشتوں کا فرق 30 سے 40 سال رہا ہے، اور ایک ہی پشت کے لوگ مختلف شاخوں میں 20–40 سال آگے پیچھے پیدا ہوئے، اسی لیے ہر پشت کے ساتھ سالوں کا دائرہ دیا گیا ہے۔</p>
    <div style="overflow-x:auto"><table class="pt"><thead><tr><th>پشت</th><th>اندازاً پیدائش</th><th>اس پشت کا ایک نام</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>${footer()}`;
  window.scrollTo({ top: 0 });
}

/* ---------- admin (hidden page: #admin) ---------- */
async function adminCall(body) {
  const r = await fetch(CONFIG.backend, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
function waNum(c) { let d = String(c).replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); if (d.startsWith('0')) d = '92' + d.slice(1); return d; }
async function viewAdmin() {
  setNav('');
  const key = store('shajra.adminKey');
  if (!key) {
    app.innerHTML = `<section class="card"><h2>منتظمین</h2><p class="hint">یہ صفحہ صرف شجرہ کے منتظمین کے لیے ہے۔ اپنی خفیہ چابی (admin key) لکھیں؛ یہ اسی فون میں محفوظ رہے گی۔</p>
      <form class="form" id="akf"><div class="field"><label for="ak">خفیہ چابی</label><input id="ak" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <button class="btn primary" type="submit" style="justify-self:start">داخل ہوں</button></form><div id="akOut"></div></section>`;
    document.getElementById('akf').onsubmit = async e => { e.preventDefault(); const k = document.getElementById('ak').value.trim(); if (!k) return;
      const o = document.getElementById('akOut'); o.innerHTML = '<p class="hint">جانچ ہو رہی ہے…</p>';
      try { const j = await adminCall({ action: 'ping', key: k }); if (j.ok) { store('shajra.adminKey', k); viewAdmin(); } else o.innerHTML = '<p class="note warn">چابی درست نہیں۔</p>'; }
      catch (err) { o.innerHTML = '<p class="note warn">رابطہ نہیں ہو سکا۔ انٹرنیٹ چیک کریں۔</p>'; } };
    return;
  }
  app.innerHTML = `<section class="card"><h2>منتظمین: نئی تجاویز</h2><div class="actions"><button class="btn" type="button" id="aRef">تازہ کریں</button><button class="btn" type="button" id="aOut">اس فون سے خارج کریں</button></div><div id="aList"><p class="hint">لوڈ ہو رہا ہے…</p></div></section>`;
  document.getElementById('aRef').onclick = viewAdmin;
  document.getElementById('aOut').onclick = () => { try { localStorage.removeItem('shajra.adminKey'); } catch (e) {} viewAdmin(); };
  const box = document.getElementById('aList');
  let j; try { const r = await fetch(`${CONFIG.backend}?action=pending&key=${encodeURIComponent(key)}`); j = await r.json(); } catch (e) { box.innerHTML = '<p class="note warn">رابطہ نہیں ہو سکا۔ انٹرنیٹ چیک کر کے «تازہ کریں» دبائیں۔</p>'; return; }
  if (!j.ok) { if (j.error === 'key') { try { localStorage.removeItem('shajra.adminKey'); } catch (e) {} return viewAdmin(); } box.innerHTML = `<p class="note warn">خرابی: ${esc(j.error)}</p>`; return; }
  const groups = []; const gk = {};
  j.pending.forEach(r => { const k = r.t + '|' + r.from; if (!gk[k]) { gk[k] = { ...r, rows: [] }; groups.push(gk[k]); } gk[k].rows.push(r); });
  groups.reverse();
  const kindTxt = { add: 'بیٹوں کا اضافہ', fix: 'نام کی اصلاح', other: 'دیگر' };
  box.innerHTML = `<div class="stats" style="margin:6px 0 10px"><div class="stat"><b>${U(j.pending.length)}</b><span>منتظر</span></div><div class="stat"><b>${U(j.approved)}</b><span>منظور شدہ</span></div><div class="stat"><b>${U(j.rejected)}</b><span>مسترد</span></div></div>` +
    (groups.length ? groups.map((g, gi) => { const tp = P[g.target];
      return `<article class="sub" data-g="${gi}"><div class="subh"><span class="chip gold">${kindTxt[g.type] || g.type}</span><small dir="ltr">${new Date(Number(g.t) || g.t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</small></div>
        ${g.target ? `<div class="subt">${g.type === 'add' ? 'والد' : 'فرد'}: ${tp ? `<a href="#${tp.id}">${esc(tp.n)}</a> <small>(${esc(chainText(tp, 3))})</small>` : esc(g.targetName)}</div>` : ''}
        ${g.rows.map(r => `<div class="subr" data-row="${r.row}" data-t="${r.t}">${r.name ? `<input class="subn" value="${esc(r.name)}" aria-label="نام">` : '<span class="hint">—</span>'}${r.year ? `<span class="chip">${U(r.year)}</span>` : ''}
          <button class="btn primary" type="button" data-act="approve">منظور</button><button class="btn" type="button" data-act="reject">مسترد</button></div>`).join('')}
        ${g.details ? `<p class="note">${esc(g.details)}</p>` : ''}
        <div class="subf">بھیجنے والے: <b>${esc(g.from)}</b> · <a href="tel:${esc(g.contact)}" dir="ltr">${esc(g.contact)}</a> · <a href="https://wa.me/${waNum(g.contact)}" target="_blank" rel="noopener">WhatsApp</a></div></article>`; }).join('')
    : '<p class="note">کوئی نئی تجویز منتظر نہیں۔</p>');
  box.onclick = async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const rowEl = b.closest('.subr'), act = b.dataset.act;
    if (act === 'reject' && !confirm('یہ اندراج مسترد کر دیں؟')) return;
    rowEl.querySelectorAll('button').forEach(x => x.disabled = true);
    try {
      const res = await adminCall({ action: 'review', key, row: Number(rowEl.dataset.row), t: rowEl.dataset.t, decision: act, name: rowEl.querySelector('.subn')?.value.trim() || '' });
      if (!res.ok) throw new Error(res.error);
      rowEl.innerHTML = `<span class="chip ${act === 'approve' ? '' : 'warn'}">${act === 'approve' ? '✓ منظور ہو گیا' : 'مسترد'}</span> ${esc(rowEl.querySelector?.('.subn')?.value || '')}`;
      toast(act === 'approve' ? 'منظور ہو گیا؛ ویب سائٹ پر نظر آنے لگے گا' : 'مسترد کر دیا');
    } catch (err) { rowEl.querySelectorAll('button').forEach(x => x.disabled = false); toast(err.message === 'changed' ? 'شیٹ بدل گئی ہے، «تازہ کریں» دبائیں' : 'نہیں ہو سکا، دوبارہ کوشش کریں'); }
  };
}

/* ---------- router ---------- */
function route() {
  const h = location.hash.slice(1);
  if (h === 'tree') return viewTree();
  if (h === 'relation') return viewRelation();
  if (h === 'suggest') return viewSuggest();
  if (h === 'pusht') return viewPusht();
  if (h === 'admin') return viewAdmin();
  if (h && (P[h])) return viewPerson(h);
  if (h.startsWith('tree-') && P[h.slice(5)]) return viewTree(h.slice(5));
  viewHome();
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g && !g.closest('.drop')) { e.preventDefault(); go(g.dataset.go); return; }
  const t = e.target.closest('[data-tree]'); if (t) { go('tree-' + t.dataset.tree); }
});
window.addEventListener('hashchange', route);

/* ---------- theme ---------- */
(function () {
  const saved = store('shajra.theme'); if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById('themeBtn').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; store('shajra.theme', nx);
  };
})();

/* ---------- boot ---------- */
function load(d) {
  DATA = d; P = {};
  d.people.forEach(p => { P[p.id] = p; p._n = norm(p.n); p._sk = dedupe(skelUr(p.n)); p._sk2 = skelUr(p.n); });
  DATTA = d.meta.datta || DATTA;
  if (APPROVED) mergeApproved(APPROVED);
  route();
}
let APPROVED = null;
function mergeApproved(j) {
  (j.fixes || []).forEach(f => { const p = P[f.t]; if (p) { p.n = f.n; p._n = norm(p.n); p._sk = dedupe(skelUr(p.n)); p._sk2 = skelUr(p.n); } });
  let pending = (j.adds || []).slice().sort((a, b) => a.o - b.o), guard = 0;
  while (pending.length && guard++ < 20) {
    pending = pending.filter(a => {
      if (P[a.id]) return false; const f = P[a.f]; if (!f) return true;
      P[a.id] = { id: a.id, n: a.n, f: a.f, c: [], g: f.g + 1, s: f.s, d: a.d, isNew: 1 };
      const q = P[a.id]; q._n = norm(q.n); q._sk = dedupe(skelUr(q.n)); q._sk2 = skelUr(q.n);
      f.c.push(a.id); return false;
    });
  }
}
load(JSON.parse(document.getElementById('seed').textContent));
fetch('data.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.meta && d.meta.version !== DATA.meta.version) load(d); }).catch(() => {});
if (CONFIG.backend) fetch(CONFIG.backend).then(r => r.json()).then(j => { if (j && j.ok) { APPROVED = j; mergeApproved(j); route(); } }).catch(() => {});
</script>
